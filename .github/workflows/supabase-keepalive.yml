# פרויקט Supabase חינמי מושהה אחרי שבוע ללא פעילות.
# ה-workflow הזה פונה למסד הנתונים כל 3 ימים כדי שיישאר פעיל.
# נדרשים Secrets במאגר: SUPABASE_URL, SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set - skipping"; exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/pb_docs?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
