name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/festive-mccarthy-9vrtvk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # כל העלאה מקבלת מספר גרסה בכתובות הקבצים, כדי שהדפדפן (גם בטלפון) יטען מיד את הגרסה החדשה
      - name: Cache-bust scripts and styles
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(from '\./[a-z-]+\.js)'#\1?v=$V'#g" js/*.js
          sed -i -E "s#(src|href)=\"((js|css|vendor)/[A-Za-z0-9._-]+\.(js|css))\"#\1=\"\2?v=$V\"#g" index.html
          sed -i "s#window.APP_VERSION = 'dev';#window.APP_VERSION = '$V';#" index.html
          echo "{\"v\":\"$V\"}" > version.json
          grep -c "APP_VERSION = '$V'" index.html
          grep -n "?v=" index.html js/app.js | head
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
